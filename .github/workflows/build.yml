name: Build CROOKED DOUBLE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Write source
        run: CROOKED_DIR="$PWD/src" bash CrookedDouble-mac-build.sh --extract-only
      - name: Build
        run: |
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCROOKED_BUILD_TESTS=ON
          cmake --build build --config Release -j 3 --target CrookedDouble_VST3 CrookedDouble_AU CrookedEngineTests
      - name: Test DSP
        run: ./build/CrookedEngineTests
      - name: Sign and push build to dist branch
        run: |
          ART=build/CrookedDouble_artefacts/Release
          mkdir -p out/VST3 out/Components
          cp -R "$ART/VST3/CROOKED DOUBLE.vst3" out/VST3/
          cp -R "$ART/AU/CROOKED DOUBLE.component" out/Components/
          codesign --force --deep --sign - "out/VST3/CROOKED DOUBLE.vst3"
          codesign --force --deep --sign - "out/Components/CROOKED DOUBLE.component"
          tar -czf crooked-double-mac.tar.gz -C out VST3 Components
          cp crooked-double-mac.tar.gz /tmp/
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git checkout --orphan dist
          git rm -rf --cached . > /dev/null
          cp /tmp/crooked-double-mac.tar.gz .
          git add -f crooked-double-mac.tar.gz
          git commit -m "build $GITHUB_SHA"
          git push -f origin dist
      - name: Make installer
        continue-on-error: true
        run: |
          mkdir -p pkgroot/Library/Audio/Plug-Ins
          cp -R out/VST3 out/Components pkgroot/Library/Audio/Plug-Ins/
          pkgbuild --root pkgroot --identifier com.ldsaudio.crookeddouble --version 1.0.0 --install-location / CROOKED-DOUBLE-Installer.pkg
      - name: Check AU
        continue-on-error: true
        run: |
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Crkd Ldsa | tail -5
      - name: Publish download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CROOKED-DOUBLE-Installer.pkg crooked-double-mac.tar.gz --title "CROOKED DOUBLE" --notes "Download the .pkg and open it. Then Rescan plug-ins in Live."
